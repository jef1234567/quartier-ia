<title>Quartier IA EdG-T</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : scène 3D plein écran ; titre en haut, rail des lieux en bas,
   panneau à droite (feuille basse sur téléphone). */
:root{
  /* Un seul univers visuel, clair : sol blanc cassé, accents rouges, encre sombre. */
  --bg:#E8E5DF; --surface:#FFFFFF; --ink:#1B1F2A; --muted:#666B78; --line:#D6D2CA;
  --accent:#D3262E; --on-accent:#FFFFFF; --brass:#8F7228;
  --shadow:0 6px 22px rgba(27,31,42,.13);
  --f-display:'Marcellus','Trajan Pro',Georgia,serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--bg)}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.flou{position:absolute;left:0;right:0;height:24%;pointer-events:none;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.flou.haut{top:0;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.flou.bas{bottom:0;height:18%;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}

.eyebrow{font:500 11px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}

.bar{position:absolute;inset:0 0 auto 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px;pointer-events:none}
.bar>*{pointer-events:auto}
.marque{display:flex;flex-direction:column;gap:3px;min-width:0;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
.marque h1{font:400 clamp(22px,5vw,30px)/1.05 var(--f-display);letter-spacing:.03em;margin:0}

.btn{display:inline-flex;align-items:center;gap:6px;font:500 13px/1 var(--f-body);padding:9px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.plein{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.plein:hover{filter:brightness(1.08)}

.lab{position:absolute;left:0;top:0;font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;padding:6px 10px;border-radius:4px;background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow);will-change:transform}

.rail{position:absolute;inset:auto 0 0 0;padding:8px 16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.aide{margin:0;font:400 12px/1.3 var(--f-mono);color:var(--muted);text-align:center;padding:5px 10px;background:var(--surface);border:1px solid var(--line);border-radius:4px;pointer-events:none}
.piste{display:flex;gap:6px;max-width:100%;overflow-x:auto;pointer-events:auto;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--surface);box-shadow:var(--shadow);scrollbar-width:none}
.piste::-webkit-scrollbar{display:none}
.chip{flex:none;font:500 13px/1 var(--f-body);padding:9px 12px;border:0;border-radius:4px;background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.chip small{font:400 11px/1 var(--f-mono);color:var(--muted);margin-left:6px}
.chip:hover{background:var(--bg)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.chip[aria-pressed="true"] small{color:inherit}

.panel{position:absolute;top:76px;right:16px;bottom:84px;width:min(380px,calc(100% - 32px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.panel>header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 16px 0}
.panel h2{font:400 26px/1.1 var(--f-display);letter-spacing:.02em;margin:4px 0 0;text-wrap:balance}
.icone{flex:none;width:34px;height:34px;border:1px solid var(--line);border-radius:4px;background:transparent;cursor:pointer;font-size:15px;line-height:1}
.icone:hover{border-color:var(--ink)}
.resume{margin:8px 16px 14px;color:var(--muted)}
.liste{flex:1;min-height:0;overflow-y:auto;border-top:1px solid var(--line)}
.carte{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
.carte h3{font:600 15px/1.3 var(--f-body);margin:0}
.carte p{margin:0;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:500 10px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.tag.t-outil{border-color:var(--accent);color:var(--accent)}
.tag.t-lien{border-color:var(--brass);color:var(--brass)}
.tag.ex{border-style:dashed}
details{align-self:stretch;min-width:0}
summary{cursor:pointer;font-weight:500;color:var(--accent);width:max-content}
.contenu{white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0;padding:12px;border-left:2px solid var(--line);background:var(--bg);font-size:14px;max-width:65ch}
.vide{padding:16px;color:var(--muted);margin:0}
.sans3d{position:absolute;inset:90px 16px auto;max-width:34rem;margin:0 auto;padding:14px 16px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--muted)}

@media (max-width:720px){
  .panel{top:auto;left:16px;right:16px;bottom:74px;width:auto;max-height:50%}
  .panel h2{font-size:22px}
}
</style>
<!--CORPS-->
<div class="app" id="app">
  <canvas id="scene" aria-label="Vue 3D du quartier : six lieux à ouvrir"></canvas>
  <div class="flou haut"></div><div class="flou bas"></div>
  <div id="labels"><div class="lab" id="pastille" hidden></div></div>
  <p class="sans3d" id="sans3d" hidden>La vue 3D n'a pas pu démarrer sur cet appareil. Les lieux restent accessibles par la barre du bas.</p>

  <header class="bar">
    <div class="marque">
      <h1 id="titre">Quartier IA</h1>
      <p class="eyebrow" id="sous-titre">EdG-T · prototype</p>
    </div>
    <button class="btn" id="vue" type="button">Vue d'ensemble</button>
  </header>

  <aside class="panel" id="panel" hidden aria-labelledby="p-nom">
    <header>
      <div>
        <p class="eyebrow" id="p-etat"></p>
        <h2 id="p-nom"></h2>
      </div>
      <button class="icone" id="p-fermer" type="button" aria-label="Fermer le panneau">✕</button>
    </header>
    <p class="resume" id="p-resume"></p>
    <div class="liste" id="p-liste"></div>
  </aside>

  <nav class="rail" aria-label="Lieux du quartier">
    <p class="aide" id="aide">Glisse pour tourner, touche un lieu pour l'ouvrir.</p>
    <div class="piste" id="piste"></div>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script type="application/json" id="contenu-defaut">__CONTENU__</script>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const reduit = matchMedia('(prefers-reduced-motion: reduce)').matches;
const etroit = matchMedia('(max-width: 720px)');
const TYPES = { texte: 'Texte', lien: 'Lien', outil: 'Outil' };

// Emplacement de chaque lieu dans la scène (x, z = centre ; w, d = emprise ; h = hauteur de l'étiquette).
const LIEUX3D = {
  bibliotheque: { x: -15.5, z: -9.5, w: 14, d: 10, h: 3.2, sol: 0xE3DBC5 },
  classe:       { x: 0,     z: -9.5, w: 13, d: 10, h: 3.2, sol: 0xE6E5E2 },
  bataille:     { x: 15.5,  z: -9.5, w: 14, d: 10, h: 2.6, sol: 0xD1D9C1 },
  atelier:      { x: -16,   z: 6.5,  w: 13, d: 9,  h: 2.8, sol: 0xE6E5E2 },
  accueil:      { x: 0,     z: 9.5,  w: 9,  d: 7,  h: 3,   sol: 0xE6E5E2, arriere: true },
  tactique:     { x: 16,    z: 6.5,  w: 13, d: 9,  h: 2.8, sol: 0xD4D8DC }
};

let DATA = null, actif = null, scene3d = null;
const app = $('#app'), panel = $('#panel');

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'text') e.textContent = attrs[k];
    else if (k === 'class') e.className = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  kids.forEach(k => k && e.append(k));
  return e;
}
// Lien accepté : adresse http(s) ou chemin relatif du dépôt. Rien d'autre.
const urlSure = u => typeof u === 'string' && (/^https?:\/\//i.test(u) || /^(?!\/\/)[\w.\-\/]+$/.test(u));

async function charger() {
  const defaut = JSON.parse($('#contenu-defaut').textContent);
  try {
    const r = await fetch('contenu.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('absent');
    const d = await r.json();
    return Array.isArray(d.lieux) ? d : defaut;
  } catch (e) { return defaut; }
}

// Modèles 3D : un fichier JSON publié à côté de la page (index + géométrie en base64). Sans lui, la scène garde des formes simples.
async function chargerModeles() {
  try {
    const r = await fetch('modeles.json');
    if (!r.ok) throw new Error('absent');
    const d = await r.json(), brut = atob(d.donnees), octets = new Uint8Array(brut.length);
    for (let i = 0; i < brut.length; i++) octets[i] = brut.charCodeAt(i);
    return { index: d.index, tampon: octets.buffer };
  } catch (e) { return null; }
}

function copier(texte, bouton, bloc) {
  const fini = t => { bouton.textContent = t; setTimeout(() => { bouton.textContent = 'Copier'; }, 1800); };
  const secours = () => {
    const s = getSelection(), r = document.createRange();
    r.selectNodeContents(bloc); s.removeAllRanges(); s.addRange(r);
    fini('Texte sélectionné');
  };
  try { navigator.clipboard.writeText(texte).then(() => fini('Copié'), secours); } catch (e) { secours(); }
}

function carte(e) {
  const type = TYPES[e.type] ? e.type : 'texte';
  const art = el('article', { class: 'carte' },
    el('div', { class: 'tags' },
      el('span', { class: 'tag t-' + type, text: TYPES[type] }),
      e.exemple ? el('span', { class: 'tag ex', text: 'Exemple' }) : null),
    el('h3', { text: e.titre || 'Sans titre' }),
    e.resume ? el('p', { text: e.resume }) : null);
  if (type === 'texte' && e.contenu) {
    const bloc = el('div', { class: 'contenu', text: e.contenu });
    const d = el('details', null, el('summary', { text: 'Lire' }), bloc);
    if (e.copiable) {
      const b = el('button', { class: 'btn', type: 'button', text: 'Copier' });
      b.addEventListener('click', () => copier(e.contenu, b, bloc));
      d.append(b);
    }
    art.append(d);
  } else if (type !== 'texte' && urlSure(e.url)) {
    art.append(el('a', { class: 'btn plein', href: e.url, target: '_blank', rel: 'noopener',
      text: type === 'outil' ? "Lancer l'outil ↗" : 'Ouvrir le lien ↗' }));
  }
  return art;
}

function majEtats() {
  document.querySelectorAll('[data-lieu]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lieu === actif)));
  if (scene3d) scene3d.activer(actif);
}

function ouvrir(id, viser = true) {
  const lieu = DATA.lieux.find(l => l.id === id);
  if (!lieu) return;
  actif = id;
  const n = (lieu.entrees || []).length;
  $('#p-etat').textContent = n + (n > 1 ? ' entrées' : ' entrée');
  $('#p-nom').textContent = lieu.nom;
  $('#p-resume').textContent = lieu.resume || '';
  const liste = $('#p-liste');
  liste.replaceChildren(...(lieu.entrees || []).map(carte));
  if (!n) liste.append(el('p', { class: 'vide', text: "Aucune entrée pour l'instant. Ajoute la première dans contenu.json." }));
  liste.scrollTop = 0;
  panel.hidden = false;
  $('#aide').hidden = true;
  majEtats();
  if (viser && scene3d) scene3d.viser(id);
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
}

function fermer() {
  actif = null; panel.hidden = true; majEtats();
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}

/*__SCENE__*/
/* ------------------------------ Démarrage ------------------------------ */
Promise.all([charger(), chargerModeles()]).then(([d, modeles]) => {
  DATA = d;
  if (d.titre) $('#titre').textContent = d.titre;
  if (d.sous_titre) $('#sous-titre').textContent = d.sous_titre;
  const piste = $('#piste');
  d.lieux.forEach(l => {
    const n = (l.entrees || []).length;
    const b = el('button', { class: 'chip', type: 'button', 'data-lieu': l.id, 'aria-pressed': 'false', text: l.nom }, el('small', { text: String(n) }));
    b.addEventListener('click', () => ouvrir(l.id));
    piste.append(b);
  });
  try { scene3d = creerScene($('#scene'), d.lieux, d.titre, modeles, id => ouvrir(id)); } catch (e) { scene3d = null; console.error(e); }
  if (!scene3d) { $('#sans3d').hidden = false; $('#aide').hidden = true; }
  $('#vue').addEventListener('click', () => { fermer(); if (scene3d) scene3d.vueEnsemble(); });
  $('#p-fermer').addEventListener('click', fermer);
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && actif) fermer(); });
  const h = location.hash.slice(1);
  if (h && d.lieux.some(l => l.id === h)) ouvrir(h);
});
})();
</script>
